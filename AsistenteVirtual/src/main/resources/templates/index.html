<!DOCTYPE html>
<html lang="es" xmlns:th="https://www.thymeleaf.org">
	
<!-- Marcos Baró -->
	
<head>
	
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	
    <title>Asistente Virtual</title>
	
	<!-- Bootstrap -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</head>

<body>
	
	<div class="container mt-5">
		
	        <h1 class="text-center">Asistente Virtual</h1>

	        <form action="#" th:action="@{/procesar}" method="post">
				
	            <div class="mb-3">
	                <label for="pregunta" class="form-label">Ingresa tu consulta:</label>
	                <input type="text" class="form-control" id="pregunta" name="pregunta" th:value="${pregunta}" placeholder="Escribe tu consulta aquí" required>
	            </div>

	            <div class="mb-3">
					<label for="dificultad" class="form-label">Selecciona el nivel de dificultad:</label>
					 <select class="form-select" id="dificultad" name="dificultad" required>
					        <option value="Facil" th:selected="${facil != null && facil == 'Facil'}">Fácil</option>
					        <option value="Avanzado" th:selected="${avanzado != null && avanzado == 'Avanzado'}">Avanzado</option>
					  </select>
	            </div>
							
				<br>

	            <button type="submit" class="btn btn-primary">Enviar Consulta</button>
				
				<button type="button" class="btn btn-secondary" onclick="limpiarFormulario()">Limpiar</button>
								
				<a class=" btn btn-info" th:href="@{/rag}" role="button">Con utilización de RAG</a> 
				
	        </form>

	        <div class="mt-3">
	            <h3>Asistente:</h3>
	            <p id="respuesta" th:text="${respuesta}"></p>
	        </div>

	    </div>
		
		<script>
		        
		        function limpiarFormulario() {
		            
		            document.getElementById("pregunta").value = "";

					const respuestaElement = document.getElementById("respuesta");
					if (respuestaElement) {
						respuestaElement.textContent = "";
					}

					document.querySelector("select").value = "";
					
		        }
				
		</script>
	
</body>

<footer>
	
	<div class="container bg-secondary" style='text-align:center'>
		<p><p><b>2025 Baró Marcos - Asistente Virtual</b></p></p>
	</div>
	
</footer>

</html>
